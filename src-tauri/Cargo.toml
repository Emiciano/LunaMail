[package]
name = "lunamail"
version = "0.9.21"
description = "Modern Mail Client for Windows"
authors = ["emilio"]
edition = "2021"

[lib]
name = "lunamail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
html2text = "0.12"
imap = "2.4"
keyring = "3.6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "pool"] }
mailparse = "0.15"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm-siv = "0.11"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tauri = { version = "2.6.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.3"
tauri-plugin-notification = "2.3"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4"] }
opener = "0.7"
url = "2"
png = "0.18"
