<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaMail</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #fff; }
      @media (prefers-color-scheme: dark) { body, #boot-splash { background: #000 !important; } }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 180ms ease-out;
      }
      #boot-splash.boot-splash-hidden { opacity: 0; pointer-events: none; }
      #boot-splash .boot-logo {
        width: 80px;
        height: 80px;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img class="boot-logo" src="./icon.png" alt="LunaMail" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
